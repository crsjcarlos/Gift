<!DOCTYPE html>
<html lang="pt-br">

        body{
            background-color:rgb(81, 81, 81);

<body>
  <h1>Exercício 2</h1> 
  <p>Faça um programa de exercício</p>
  <script>
    var nome = window.prompt('Qual é o seu nome?')
    var idade = Number(window.prompt('Qual é a sua idade ao fim de 2026?'))
    document.write(`Olá, <strong>${nome.toUpperCase()}</strong>. Seu nome tem ${nome.length} caracteres e você nasceu em ${2026 - idade}.`)
  </script>
</body>
