<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Escaneie</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #080808 0%,
                    #171717 50%,
                    #080808 100%
                );

            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 35px;
        }

        .heart {
            color: #ff4d6d;
            font-size: 1.1em;
        }

        .qr-code {
            width: min(75vw, 380px);
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>
            Escaneie <span class="heart">♥</span>
        </h1>

        <img
            class="qr-code"
            src="QR_Code_Gift_GitHub_Pages.png"
            alt="QR Code para acessar o site"
        >

    </main>

</body>
</html>
