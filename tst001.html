<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1</title>
    <style>
        body{
            background-color:rgb(81, 81, 81);
            color:rgb(72, 9, 9);
            font:normal 20pt Arial;
            font-weight:bold; 
        }
    </style>
</head>
<body>
  <h1>Exercício 1</h1> 
  <p>Faça um programa de exercício</p>
  <script>
    var n1 = Number(window.prompt('Digite um número'))
    var n2 = Number(window.prompt('Digite outro número'))
    var s = n1 + n2
    window.alert(`O valor em reais da soma entre ${n1} e ${n2} é igual a ${s.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}.`)

  </script>
</body>
</html>
